# Orchestrates all isolated services required by the e-commerce stack:
#
# 1. db (PostgreSQL 15)           : Primary relational database (Port: 5432)
# 2. pgadmin (pgAdmin 4)          : Web-based PostgreSQL administration interface (Port: 8080)
# 3. redis (Redis Alpine)         : In-memory cache and Celery message broker (Port: 6379)
# 4. backend (Django + DRF)       : Core REST API server and template host (Port: 8000)
# 5. celery_worker                : Asynchronous queue worker for background processing
# 6. celery_beat                  : Periodic task scheduler
# 7. flower (Celery Dashboard)    : Real-time Celery worker and task monitor (Port: 5555)
# ==============================================================================

services:
  # Database
  db:
    image: postgres:15
    container_name: e-ticaret_db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data # To protect data from being deleted
    # Controlling backend before starting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - e-ticaret-net

  # Database Admin Panel
  pgadmin:
    image: dpage/pgadmin4
    container_name: e-ticaret_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - e-ticaret-net

  # DJANGO
  backend:
    build: .
    container_name: e-ticaret_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app # Computer's code change instantly importing (Hot Reload)
    env_file:
      - .env # Importing .env file's all variables
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # Waiting for healthcheck to pass
      redis:
        condition: service_started
    networks:
      - e-ticaret-net

  # REDIS CACHE
  redis:
    image: redis:7-alpine
    container_name: e-ticaret_redis
    ports:
      - "6379:6379"
    networks:
      - e-ticaret-net

  # CELERY WORKER
  celery_worker:
    build: .
    container_name: e-ticaret_celery_worker
    command: celery -A main worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env # Celery also needs to know the email passwords
    depends_on:
      - redis
      - db
    networks:
      - e-ticaret-net

  # Celery Beat (Timer for periodic tasks)
  celery_beat:
    build: .
    container_name: e-ticaret_celery_beat
    command: celery -A main beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env # Beat de env'leri bilmeli
    depends_on:
      - redis
      - db
    networks:
      - e-ticaret-net

  # FLOWER (Celery Monitoring Web UI)
  flower:
    build: .
    container_name: e-ticaret_flower
    command: celery -A main flower --port=5555
    volumes:
      - .:/app  # Güncel kodu container'a bağla
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
      - celery_worker
    networks:
      - e-ticaret-net

# Networks and volumes to be created
networks:
  e-ticaret-net:
    driver: bridge

volumes:
  postgres_data:
